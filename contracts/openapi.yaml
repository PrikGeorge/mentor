        createdAt:
          type: string
          format: date-time
          description: UTC creation instant.
        studentNotes:
          $ref: '#/components/schemas/LessonMarkdown'
        reviewNotes:
          $ref: '#/components/schemas/LessonMarkdown'
    LessonPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
