    ExerciseRevision:
      description: 'Typed scalar identity, never string-coerced or trimmed. JSON numeric 1 and 1.0 are the same
        n:1 identity; JSON string "1" is distinct s:1. Strings are nonempty, well-formed Unicode with at most 100
        UTF-16 units, preserving all whitespace. Numbers are exact integers in 0..9007199254740991. Reject null,
        boolean, container, negative, fractional, unsafe numeric values, and malformed Unicode. Unsupported historical
        import values cause explicit inspection errors; never rewrite them. No discriminator object wraps the wire
        value: the string/integer branches discriminate by JSON scalar kind.'
      oneOf:
      - type: string
        minLength: 1
        x-max-utf16-units: 100
        x-well-formed-unicode: true
      - type: integer
        minimum: 0
        maximum: 9007199254740991
    Placement:
      type: string
      enum:
      - class
      - homework
    SourceFiles:
      type: object
      minProperties: 1
      maxProperties: 16
      propertyNames:
        pattern: ^(?:[A-Za-z_$][A-Za-z0-9_$]*/)*[A-Za-z_$][A-Za-z0-9_$]*\.java$(?![\s\S])
      additionalProperties:
        type: string
        pattern: ^[^\u0000]*$
        x-max-utf8-bytes: 131072
        x-well-formed-unicode: true
      x-max-total-utf8-bytes: 262144
      description: 'Exact named Java source strings, including package paths, whitespace, and line endings. Submitted
        keys equal the complete current declared set: 1..16 files, no aliases, traversal, backslashes, or undeclared
        resources. Valid source contains neither NUL nor malformed Unicode; bounds measure actual UTF-8 bytes (131072
        each, 262144 total), not characters or JSON-escaped bytes. Standard maxLength does not express these limits.
        Saved historical reads retain their original declaration and source without validation against a newer catalog.
        Reading files does not authorize their execution.'
    PublicEnvironment:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - javaVersion
      - dependencies
      properties:
        id:
          type: string
        title:
          type: string
        javaVersion:
          type: integer
          const: 21
        dependencies:
          type: array
          items:
            type: string
          description: Public pinned Maven groupId:artifactId:version descriptions only.
      description: Explicit public description frozen with the exercise snapshot. No image digest/tag, internal
        build revision, SHA metadata, jar path, processor, build command, or manifest provenance is exposed. Trusted
        operator environment approval remains internal.
