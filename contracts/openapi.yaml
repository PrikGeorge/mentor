openapi: 3.1.0
info:
  title: Mentor Platform API
  version: 0.1.0
servers:
- url: /api/v1
security:
- sessionCookie: []
paths:
  /auth/session:
    get:
      operationId: getSession
      security: []
      description: Returns the current account and a CSRF token, including for anonymous clients. Session secrets
        are sent only in a host-only cookie.
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      operationId: login
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - login
              - password
              properties:
                login:
                  type: string
                  maxLength: 200
                password:
                  type: string
                  description: Preserved exactly; no whitespace trimming.
      responses:
        '200':
          description: Authenticated session with rotated cookie and fresh CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      description: Requires CSRF; authenticated callers also pass their account ID. Anonymous logout remains idempotent.
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - name: X-Mentor-Account
        in: header
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Session invalidated
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/change-password:
    post:
      operationId: changePassword
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - currentPassword
              - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  description: 8–128 Unicode scalar values
                  up to 512 UTF-8 bytes: null
                  valid Unicode: null
                  spaces preserved.: null
      responses:
        '200':
          description: Session with updated authVersion; other sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/register:
    post:
      operationId: register
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password:
    post:
      operationId: resetPassword
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Operation completed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/teachers:
    get:
      operationId: listTeachers
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/teacher-invitations:
    get:
      operationId: listTeacherInvitations
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: issueTeacherInvitation
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties: {}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationIssue'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/teacher-invitations/{id}:
    delete:
      operationId: revokeTeacherInvitation
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Operation completed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/teachers/{id}/access:
    patch:
      operationId: changeTeacherAccess
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessChange'
      responses:
        '204':
          description: Operation completed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/workspaces/{id}/access:
    patch:
      operationId: changeWorkspaceAccess
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessChange'
      responses:
        '204':
          description: Operation completed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/teachers/{id}/password-reset:
    post:
      operationId: issueTeacherPasswordReset
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetIssue'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /workspaces/{workspaceId}/students:
    get:
      operationId: listStudents
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: audience
        in: query
        schema:
          type: string
          enum:
          - student
        description: Narrows teacher output to the public projection; grants no permissions.
      - name: archived
        in: query
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
          - all
        description: Teacher listing filter, default false (active cards only); true lists archived cards, all lists both.
          A student always sees only their own card.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createStudent
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      responses:
        '201':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
  /workspaces/{workspaceId}/schedule:
    get:
      operationId: getTeacherSchedule
      description: The teacher's lessons across every active (not archived) card of this exact workspace whose Moscow
        date lies in the inclusive window from..to (one to 31 days). Ordered by date, time, createdAt and id. Lesson
        numbers are counted over each card's whole calendar. Only the teacher of the workspace; students, other
        teachers and administrators receive 404. Not paginated because the window is bounded.
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/LessonDate'
      - name: to
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/LessonDate'
      responses:
        '200':
          description: Lessons in the window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspaceId}/students/dashboards:
    get:
      operationId: listStudentDashboards
      description: The teacher's list screen in one request, the same page of cards as listStudents (same archived
        filter, same ordering) with each card's lesson count and focus lesson, so the screen makes no per-card dashboard
        calls. A student receives only their own card. Caller projection applies to student and lesson fields.
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: archived
        in: query
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
          - all
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Page of dashboards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspaceId}/students/{studentId}:
    get:
      operationId: getStudent
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      - name: audience
        in: query
        schema:
          type: string
          enum:
          - student
        description: Narrows teacher output to the public projection; grants no permissions.
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateStudent
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateInput'
  /workspaces/{workspaceId}/students/{studentId}/access:
    get:
      operationId: getStudentAccess
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentAccessView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: changeStudentAccess
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      responses:
        '204':
          description: Operation completed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessChange'
  /workspaces/{workspaceId}/students/{studentId}/invitations:
    post:
      operationId: issueStudentInvitation
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationIssue'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
  /workspaces/{workspaceId}/students/{studentId}/invitations/{id}:
    delete:
      operationId: revokeStudentInvitation
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      responses:
        '204':
          description: Operation completed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /workspaces/{workspaceId}/students/{studentId}/password-reset:
    post:
      operationId: issueStudentPasswordReset
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetIssue'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
  /workspaces/{workspaceId}/students/{studentId}/lessons:
    parameters:
    - $ref: '#/components/parameters/Task3WorkspaceId'
    - $ref: '#/components/parameters/Task3StudentId'
    get:
      operationId: listLessons
      description: Exact workspace/profile membership required; ADMIN and foreign content return 404. Sort date,
        time, createdAt, id descending. Returns summaries without lesson texts for all roles; audience=student
        preserves the same summary without changing Actor or permissions.
      parameters:
      - $ref: '#/components/parameters/Task3Audience'
      - $ref: '#/components/parameters/Task3Page'
      - $ref: '#/components/parameters/Task3Size'
      responses:
        '200':
          description: Paged lessons in caller projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createLesson
      description: Owning TEACHER only. Short four-field form; planned status, null bundleId, empty texts, metadata
        revision 1 and each independent text revision 1 are server defaults. No historical studentReview or reviewNotes
        is copied into the new lesson.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCreateInput'
      responses:
        '201':
          description: Created lesson; navigate to preparation only after this success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherLessonView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspaceId}/students/{studentId}/lessons/{lessonId}:
    parameters:
    - $ref: '#/components/parameters/Task3WorkspaceId'
    - $ref: '#/components/parameters/Task3StudentId'
    - $ref: '#/components/parameters/Task3LessonId'
    get:
      operationId: getLesson
      description: Exact workspace/profile/lesson membership required; caller projection enforced server-side.
      parameters:
