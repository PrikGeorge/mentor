    Mode:
      type: string
      enum:
      - run
      - submit
      description: run selects the published sample tests; submit selects all published tests.
    JobState:
      type: string
      enum:
      - queued
      - running
      - completed
      - failed
      description: queued/running have no public final result; a private pending infrastructure retry stays running.
        completed is terminal for every student verdict, including a failed check; failed is terminal infrastructure
        exhaustion. Neither state discloses internal job/lease identifiers.
    AttemptEnqueue:
      type: object
      additionalProperties: false
      required:
      - exerciseRevision
      - mode
      - files
      properties:
        exerciseRevision:
          $ref: '#/components/schemas/ExerciseRevision'
        mode:
          $ref: '#/components/schemas/Mode'
        files:
          $ref: '#/components/schemas/SourceFiles'
    PublicResultValue:
      type:
      - string
      - number
      - boolean
      - 'null'
      description: Legacy-compatible scalar presentation value. Structured expected/actual output is rendered as
        a bounded, sanitized JSON string, never an arbitrary nested public checker object. Finite JSON numbers,
        booleans and null retain their scalar type. All strings count toward the complete serialized CheckResult
        ceiling and undergo host-path sanitization.
    PublicTestResult:
      type: object
      additionalProperties: false
      required:
      - name
      - status
      properties:
        name:
          type: string
          x-max-utf16-units: 200
        status:
          type: string
          enum:
          - accepted
          - wrong_answer
          - runtime_error
          - time_limit
        expected:
          $ref: '#/components/schemas/PublicResultValue'
        actual:
          $ref: '#/components/schemas/PublicResultValue'
        message:
          type: string
        stdout:
          type: string
      description: Explicit safe per-test projection, in execution order. No args, mutation rules, customTypes,
        class/method metadata, nonce, host paths or private checker properties. Optional text/value content may
        be shortened or omitted to meet the whole-result limit without changing verdicts.
    CheckResult:
      type: object
      additionalProperties: false
      required:
      - status
      - passed
      - total
      - elapsedMs
      - tests
      properties:
        status:
          type: string
          enum:
          - accepted
          - wrong_answer
          - compile_error
          - runtime_error
          - time_limit
          - error
          - unavailable
        passed:
          type: integer
          minimum: 0
          maximum: 100
        total:
          type: integer
          minimum: 0
          maximum: 100
        elapsedMs:
          type: integer
          format: int64
          minimum: 0
        diagnostics:
          type: string
        tests:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PublicTestResult'
      x-max-serialized-utf16-units: 32000
      description: Bounded explicit public result, not a runner payload or persistence entity. The entire serialized
        result, including field names, delimiters and JSON escaping, must fit 32000 UTF-16 units. All returned text
        is host-path-sanitized and Unicode-safe; preserve ordinary URLs and relative Java filenames. passed must
        not exceed total. accepted requires total>0, passed=total and a verified trusted harness result; matching
        counters alone do not establish success. Partial test detail is valid for compile/runtime/time failure.
        Projection/truncation never changes counters or fabricates acceptance. Internal live result validation is
        separate from this public schema.
    AttemptSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - exerciseId
      - exerciseRevision
      - environmentRevision
      - mode
      - jobState
      - result
      - createdAt
      properties:
        id:
          type: string
        exerciseId:
          type: string
        exerciseRevision:
          $ref: '#/components/schemas/ExerciseRevision'
        environmentRevision:
          type:
          - string
          - 'null'
          description: Pinned build revision; null only for imported history lacking environment metadata.
        mode:
          $ref: '#/components/schemas/Mode'
        jobState:
          $ref: '#/components/schemas/JobState'
        result:
          oneOf:
          - $ref: '#/components/schemas/CheckResult'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
      description: Historical public attempt without files. Pending result is null; terminal result is present.
        New environmentRevision is non-null. Source appears only in detail/enqueue replies.
    Attempt:
      type: object
      additionalProperties: false
      required:
      - id
      - exerciseId
      - exerciseRevision
      - environmentRevision
      - mode
      - jobState
      - files
      - result
      - createdAt
      properties:
        id:
          type: string
        exerciseId:
          type: string
        exerciseRevision:
          $ref: '#/components/schemas/ExerciseRevision'
        environmentRevision:
          type:
          - string
          - 'null'
          description: Pinned build revision; null only for imported history lacking environment metadata.
        mode:
          $ref: '#/components/schemas/Mode'
        jobState:
          $ref: '#/components/schemas/JobState'
        files:
          $ref: '#/components/schemas/SourceFiles'
        result:
          oneOf:
          - $ref: '#/components/schemas/CheckResult'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
      description: Exact immutable accepted source and current state; bare response, not an attempt wrapper. Pending
        result is null; terminal result is present. No account, worker, lease, test-definition or environment image/manifest
        fields are exposed. Historical files retain their original declaration/revision and are not validated against
        today's catalog just to read them.
    AttemptPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttemptSummary'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    PracticeHistoryEntry:
      type: object
      additionalProperties: false
      required:
      - exerciseId
      - active
      - hasDraft
      - hasAttempts
      - hasArchives
      properties:
        exerciseId:
          type: string
        active:
          type: boolean
        hasDraft:
          type: boolean
        hasAttempts:
          type: boolean
        hasArchives:
          type: boolean
    PracticeHistoryPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PracticeHistoryEntry'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
  headers:
    MaterialNoStore:
      schema:
        type: string
        const: no-store
    MaterialNoSniff:
      schema:
        type: string
        const: nosniff
    MaterialDisposition:
      description: Attachment with normalized ASCII filename and UTF-8 filename*. Never includes a physical path
        or control characters.
      schema:
        type: string
