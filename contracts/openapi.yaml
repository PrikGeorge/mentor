        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    DashboardFocus:
      type: object
      additionalProperties: false
      required:
      - lesson
      - upcoming
      properties:
        lesson:
          $ref: '#/components/schemas/LessonView'
        upcoming:
          type: boolean
          description: True for next/current through exact end; false for latest past fallback.
    Dashboard:
      type: object
      additionalProperties: false
      description: Caller projection applied recursively; public dashboard has neither student.notes nor focus.lesson.teacherNotes.
      required:
      - student
      - lessonCount
      - focus
      properties:
        student:
          $ref: '#/components/schemas/StudentView'
        lessonCount:
          type: integer
          format: int64
          minimum: 0
        focus:
          oneOf:
          - $ref: '#/components/schemas/DashboardFocus'
          - type: 'null'
