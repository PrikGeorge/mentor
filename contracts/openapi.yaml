        '200':
          description: Homework submission history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeworkPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: submitHomework
      description: Actual owning STUDENT only. Each successful upload creates a new submission unless the same
        Idempotency-Key was already stored in this lesson with the same file bytes, filename, comment and link; then
        the stored submission is returned again with 201 and no second work exists. The same key with other content
        answers 409 IDEMPOTENCY_CONFLICT. Teacher preview never submits. Exactly one nonempty ZIP, Java, TXT, Markdown
        or PDF file, at most 20 MiB. Multipart request at most 21 MiB. Reject duplicate or unknown parts. Recheck
        authority before transactional attach; no201 before commit. Never unpack or execute uploaded projects.
      parameters:
      - $ref: '#/components/parameters/HomeworkIdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  x-max-bytes: 20971520
                  description: Nonempty. Safe filename up to180 UTF-16 units; forbid paths, Windows device names
                    and special/control characters, leading dot or trailing dot/space. ZIP requires a recognized
                    four-byte header without unpacking.
                comment:
                  type: string
                  default: ''
                  x-max-utf16-units: 10000
                  description: JavaScript-compatible trimmed text; bound checked before trim.
                repositoryUrl:
                  type: string
                  default: ''
                  x-max-utf16-units: 2000
                  description: JavaScript-compatible trimmed empty string or HTTPS URL with hostname and without
                    userinfo. Never fetched by server.
      responses:
        '201':
          description: New committed submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspaceId}/students/{studentId}/lessons/{lessonId}/homework/{submissionId}/file:
