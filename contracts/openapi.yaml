      in: header
      required: true
      schema:
        type: string
    Task3WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    Task3StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
    Task3LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
    Task3TextKind:
      name: kind
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TextKind'
    Task3Audience:
      name: audience
      in: query
      required: false
      description: Optional narrowing to student projection; never changes Actor or permissions. Omitted uses actor's
        projection; STUDENT always gets public projection. Unsupported values return 400. TEACHER preview is read-only
        in UI and grants no student submission rights.
      schema:
        type: string
        enum:
        - student
    Task3Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Task3Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    MaterialWorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    MaterialStudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
    MaterialLessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
    MaterialId:
      name: materialId
      in: path
      required: true
      schema:
        type: string
    MaterialAudience:
      name: audience
      in: query
      description: Optional narrowing only. Student always receives student projection. Teacher preview never changes
        Actor or allows student writes. Unknown values return400.
      schema:
        type: string
        enum:
        - student
    MaterialPageNumber:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    MaterialPageSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PracticeExerciseId:
      name: exerciseId
      in: path
      required: true
      schema:
        type: string
    PracticeArchiveId:
      name: archiveId
      in: path
      required: true
      schema:
        type: string
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
    HomeworkIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional for homework; the web client always sends one. Case-sensitive untrimmed ASCII token kept
        for the whole upload attempt and resent unchanged after response loss, dropped once the form resets. Scope is
        one lesson of one card; retained for the lifetime of the submission. Duplicate, empty or invalid values return
        400 INVALID_INPUT.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]{1,128}$(?![\s\S])
    AttemptIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Case-sensitive untrimmed ASCII token, reused with the same exact payload after response loss.
        UUIDs are suitable. Missing, duplicate, empty or invalid values return 400 INVALID_INPUT. Scope is account
        plus stable assignment; retain for the lifetime of attempt history.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]{1,128}$(?![\s\S])
    PracticeAttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    MaterialAuthoring:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required:
            - kind
            - audience
            properties:
              kind:
                type: string
                enum:
                - doc
                - download
                description: doc renders markdown server-side; download stores exactly one file part.
              audience:
                type: string
                enum:
                - student
                - teacher
              title:
                type: string
                maxLength: 200
                description: Trimmed. For a document it defaults to the first level-one heading, else "Материал"; for a
                  file it defaults to the filename.
              contentKey:
                type: string
                pattern: ^[a-z][a-z0-9-]{0,39}$(?![\s\S])
                description: The material's role in the screens (student, homework, guide, lesson, answers, review,
                  student-materials, source, student-roadmap, roadmap, profile). Optional; unique per lesson,
                  audience and kind doc.
              markdown:
                type: string
                minLength: 1
                maxLength: 200000
                description: Required for kind doc, forbidden for download. The first "# " line becomes the title, each
                  "## " line opens a section.
              file:
                type: string
                format: binary
                x-max-bytes: 20971520
                description: Required for kind download, forbidden for doc. Safe filename rules as for homework.
