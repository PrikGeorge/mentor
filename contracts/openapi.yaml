    get:
      operationId: listStudentHomeworkTurns
      description: The teacher's review queue. Exact TEACHER membership only; STUDENT, ADMIN and foreign workspaces
        return 404. One row per student with at least one submission. Per lesson only its latest submission counts;
        per student the row is the oldest lesson whose latest submission awaits review, otherwise the latest exchange.
        Rows awaiting review come first, oldest createdAt first; the rest follow by createdAt descending.
        awaitingReview counts the student's lessons whose latest submission awaits review.
      parameters:
