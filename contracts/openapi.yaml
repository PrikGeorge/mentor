          type: boolean
          description: Typed mismatch against this active exercise; false for a missing draft.
      description: Contextual active-practice summary with no files. A missing draft projects the current exercise
        revision, counter 0, updatedAt null, and outdated false. Outdated is computed, not a persisted revision
        identity and not part of the bare Draft DTO.
    AssignedExercise:
      type: object
      additionalProperties: false
      required:
      - assignmentId
      - placement
      - exercise
      - draft
      properties:
        assignmentId:
          type: string
          description: Stable through deactivation/reactivation and placement changes.
        placement:
          $ref: '#/components/schemas/Placement'
        exercise:
          $ref: '#/components/schemas/PublicExercise'
        draft:
          $ref: '#/components/schemas/DraftSummary'
    LessonPracticeView:
      type: object
      additionalProperties: false
      required:
      - revision
      - exercises
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Assignment-set CAS counter, initially 0. Every successful assignments PUT increments it once,
            including empty lists. Catalog publication does not increment this counter.
        exercises:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AssignedExercise'
          description: Active assignments only, in the teacher's saved order.
    AssignmentsPut:
      type: object
      additionalProperties: false
      required:
      - revision
      - assignments
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        assignments:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - exerciseId
            - placement
            properties:
              exerciseId:
                type: string
              placement:
                $ref: '#/components/schemas/Placement'
          description: Empty is explicit and persisted. Exercise IDs must be unique within the list.
          x-unique-by: exerciseId
    DraftPut:
      type: object
      additionalProperties: false
      required:
      - exerciseRevision
      - revision
      - files
      properties:
        exerciseRevision:
          $ref: '#/components/schemas/ExerciseRevision'
        revision:
          type: integer
          format: int64
          minimum: 0
        files:
          $ref: '#/components/schemas/SourceFiles'
        resetForRevision:
          $ref: '#/components/schemas/ExerciseRevision'
          description: Optional explicit reset/port consent; omission means no consent and null is invalid. If supplied,
            must match the current typed exercise revision in every case. Required when saved code belongs to an
            older revision. The submitted files are saved exactly; server-side template substitution is forbidden.
    DraftArchiveSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - assignmentId
      - exerciseId
      - exerciseRevision
      - revision
      - updatedAt
      - archivedAt
      - reason
      properties:
        id:
          type: string
        assignmentId:
          type: string
        exerciseId:
          type: string
        exerciseRevision:
          $ref: '#/components/schemas/ExerciseRevision'
        revision:
          type: integer
          format: int64
          minimum: 0
        updatedAt:
          type: string
          format: date-time
          description: Exact original UTC draft save instant, retained for stable history ordering.
        archivedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC archive event instant; null for imported history whose event time is unknown.
        reason:
          type: string
          enum:
          - exercise_revision_changed
          - imported
      description: Historical metadata only; files are returned only by the detail route.
    DraftArchive:
      type: object
      additionalProperties: false
      required:
      - id
      - assignmentId
      - exerciseId
      - exerciseRevision
      - revision
      - updatedAt
      - archivedAt
      - reason
      - files
      properties:
        id:
          type: string
        assignmentId:
          type: string
        exerciseId:
          type: string
        exerciseRevision:
          $ref: '#/components/schemas/ExerciseRevision'
        revision:
          type: integer
          format: int64
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type:
          - string
          - 'null'
          format: date-time
        reason:
          type: string
          enum:
          - exercise_revision_changed
          - imported
        files:
          $ref: '#/components/schemas/SourceFiles'
      description: Immutable archive detail. Preserve exact prior files, typed exercise revision, draft counter,
        and original save timestamp. A missing imported archive timestamp stays null. Current catalog and assignment
        activity do not determine historical read permission.
    DraftArchivePage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DraftArchiveSummary'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
  headers:
    MaterialNoStore:
      schema:
        type: string
        const: no-store
    MaterialNoSniff:
      schema:
        type: string
        const: nosniff
    MaterialDisposition:
      description: Attachment with normalized ASCII filename and UTF-8 filename*. Never includes a physical path
        or control characters.
      schema:
        type: string
    MaterialLength:
      description: Measured attached file bytes, not caller-provided Content-Length
      schema:
        type: integer
        format: int64
        minimum: 0
