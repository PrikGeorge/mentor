  /workspaces/{workspaceId}/students/{studentId}/lessons/{lessonId}/practice/exercises/{exerciseId}/attempts:
    parameters:
    - $ref: '#/components/parameters/Task3WorkspaceId'
    - $ref: '#/components/parameters/Task3StudentId'
    - $ref: '#/components/parameters/Task3LessonId'
    - $ref: '#/components/parameters/PracticeExerciseId'
    get:
      operationId: listPracticeAttempts
      description: Read paged historical attempt summaries for this exact workspace/student/lesson/exercise tuple.
        Ordinary current lesson authorization permits the actual owner STUDENT and owning TEACHER; ADMIN and foreign
        content return 404. Active account/workspace/membership remain required. Stable historical assignment ownership
        is sufficient after assignment deactivation, explicit-empty assignment sets, or loss/change of the current
        catalog. Do not require an active assignment or prepared material bundle. A known historical assignment
        with no attempts returns an empty page; a nonexistent assignment returns 404. Sort createdAt descending,
        then id descending. No files, private checker properties, internal job/lease identifiers or environment
        image details are returned. Each summary includes its bounded public per-test result when terminal. audience=student
        only narrows projection and never changes Actor or write permission.
      parameters:
      - $ref: '#/components/parameters/Task3Audience'
      - $ref: '#/components/parameters/Task3Page'
      - $ref: '#/components/parameters/Task3Size'
      responses:
        '200':
          description: Historical attempt page, without submitted source snapshots.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: enqueuePracticeAttempt
      description: Actual owning STUDENT only; teacher preview never grants enqueue rights. Require browser Origin/client,
        CSRF and matching X-Mentor-Account before mutation. Account mismatch returns 409 ACCOUNT_CHANGED. Accept
        exactly exerciseRevision/mode/files with all declared filenames; invalid body/header/source returns 400
        INVALID_INPUT. New attempts require active assignment, current typed exercise revision, compatible saved
        draft, and atomic queue capacity. Outdated exercise or draft returns 409 EXERCISE_REVISION_CONFLICT; reset
        the draft explicitly first. Unavailable/inactive assignment for a new key returns 404. Atomically persist
        one attempt and immutable code/exercise/tests/environment/resource snapshot. New environmentRevision is
        non-null. Idempotency scope is account plus stable assignment plus exact key. Same key and canonically identical
        typed revision/mode/exact source returns the existing attempt; changed payload returns 409 IDEMPOTENCY_CONFLICT.
        Identical accepted replay remains possible after assignment removal or catalog publication while the current
        student retains history access, and does not consume queue capacity. Every successful new enqueue or identical
        replay returns 202, including replay of a terminal attempt, with current jobState/result and canonical detail
        Location. Keep keys for retained attempt history. Queue overflow returns 429 QUEUE_FULL without persisting
        an attempt, job or key reservation; identical committed replay bypasses a newly full queue. Assignment removal/session
        invalidation after 202 does not cancel accepted work. Enqueue does not save, reset or archive the draft.
        The raw JSON body limit is 1605632 bytes, including chunked input and all accepted JSON media types; larger
        bodies return 413. Source limits remain 16 declared files, 131072 UTF-8 bytes each and 262144 in total.
        No user-supplied environment/checker/command fields are accepted. Poll with GET on Location; no separate
        poll endpoint exists.
      x-max-request-body-bytes: 1605632
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      - $ref: '#/components/parameters/AttemptIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptEnqueue'
      responses:
        '202':
          description: Durable accepted attempt or identical replay, with current state and exact source.
          headers:
            Location:
              description: Same-origin relative canonical /api/v1/.../attempts/{attemptId} detail URL.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '429':
          description: QUEUE_FULL; no new attempt, job or key reservation was committed.
          headers:
            Retry-After:
              description: Optional suggested retry delay in seconds; not a completion estimate.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '503':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspaceId}/students/{studentId}/lessons/{lessonId}/practice/exercises/{exerciseId}/attempts/{attemptId}:
    parameters:
    - $ref: '#/components/parameters/Task3WorkspaceId'
    - $ref: '#/components/parameters/Task3StudentId'
    - $ref: '#/components/parameters/Task3LessonId'
    - $ref: '#/components/parameters/PracticeExerciseId'
    - $ref: '#/components/parameters/PracticeAttemptId'
    get:
      operationId: getPracticeAttempt
      description: 'Read or poll one attempt with its immutable exact submitted files. Authorize current actor,
        workspace/student/lesson and stored historical assignment on every request, matching every path component.
        Current active assignment/catalog is not required; account/workspace blocking closes access immediately.
        Owning teacher and actual owner student may read; ADMIN and foreign tuples return 404. audience=student
        preserves Actor. Return 200 with the current state on every authorized poll: queued/running has result null,
        completed/failed has a bounded public result. A first infrastructure failure retains public running while
        a private reserved slot awaits retry; do not expose private failure receipts or lease details. completed
        includes unsuccessful student verdicts; failed means exhausted infrastructure execution. Terminal state/result
        is immutable. Missing imported environment information remains null; new attempts always retain their pin.
        Reading old files does not authorize rerunning them or change drafts/archives.'
      parameters:
      - $ref: '#/components/parameters/Task3Audience'
      responses:
        '200':
          description: Exact attempt detail and current poll state.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspaceId}/students/{studentId}/lessons/{lessonId}/practice/history:
    parameters:
    - $ref: '#/components/parameters/Task3WorkspaceId'
    - $ref: '#/components/parameters/Task3StudentId'
    - $ref: '#/components/parameters/Task3LessonId'
    get:
      operationId: listPracticeHistory
      description: Discover every exercise with a saved draft, attempt or draft archive in this exact lesson, including
        removed assignments and unavailable definitions. Current owning STUDENT or owning TEACHER only; ADMIN and
        foreign content return 404. The current lesson/card/workspace/account must remain accessible. No active
        assignment, current catalog or prepared bundle is required. Sort exerciseId ascending; page starts at zero.
        Empty untouched assignments are omitted. This index returns identifiers and existence flags only, never
        files or exercise definitions; existing authorized per-exercise draft/attempt/archive APIs provide immutable
        detail. active describes the historical assignment row and alone does not authorize execution. audience=student
        never changes Actor or grants writes. Read-only and no-store.
      parameters:
      - $ref: '#/components/parameters/Task3Audience'
      - $ref: '#/components/parameters/Task3Page'
      - $ref: '#/components/parameters/Task3Size'
      responses:
        '200':
          description: Historical exercise discovery page.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeHistoryPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
