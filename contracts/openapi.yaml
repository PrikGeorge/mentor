openapi: 3.1.0
info:
  title: Mentor Platform API
  version: 0.1.0
servers:
- url: /api/v1
security:
- sessionCookie: []
paths:
  /auth/session:
    get:
      operationId: getSession
      security: []
      description: Returns the current account and a CSRF token, including for anonymous clients. Session secrets
        are sent only in a host-only cookie.
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      operationId: login
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - login
              - password
              properties:
                login:
                  type: string
                  maxLength: 200
                password:
                  type: string
                  description: Preserved exactly; no whitespace trimming.
      responses:
        '200':
          description: Authenticated session with rotated cookie and fresh CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      description: Requires CSRF; authenticated callers also pass their account ID. Anonymous logout remains idempotent.
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - name: X-Mentor-Account
        in: header
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Session invalidated
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/change-password:
    post:
      operationId: changePassword
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - currentPassword
              - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  description: 8–128 Unicode scalar values
                  up to 512 UTF-8 bytes: null
                  valid Unicode: null
                  spaces preserved.: null
      responses:
        '200':
          description: Session with updated authVersion; other sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/register:
    post:
      operationId: register
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password:
    post:
      operationId: resetPassword
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Operation completed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/teachers:
    get:
      operationId: listTeachers
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/teacher-invitations:
    get:
      operationId: listTeacherInvitations
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: issueTeacherInvitation
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties: {}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationIssue'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/teacher-invitations/{id}:
    delete:
      operationId: revokeTeacherInvitation
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Operation completed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/teachers/{id}/access:
    patch:
      operationId: changeTeacherAccess
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessChange'
      responses:
        '204':
          description: Operation completed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/workspaces/{id}/access:
    patch:
      operationId: changeWorkspaceAccess
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessChange'
      responses:
        '204':
          description: Operation completed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/teachers/{id}/password-reset:
    post:
      operationId: issueTeacherPasswordReset
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetIssue'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /workspaces/{workspaceId}/students:
    get:
      operationId: listStudents
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: audience
        in: query
        schema:
          type: string
          enum:
          - student
        description: Narrows teacher output to the public projection; grants no permissions.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createStudent
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      responses:
        '201':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
  /workspaces/{workspaceId}/students/{studentId}:
    get:
      operationId: getStudent
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      - name: audience
        in: query
        schema:
          type: string
          enum:
          - student
        description: Narrows teacher output to the public projection; grants no permissions.
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateStudent
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateInput'
  /workspaces/{workspaceId}/students/{studentId}/access:
    get:
      operationId: getStudentAccess
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentAccessView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: changeStudentAccess
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      responses:
        '204':
          description: Operation completed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessChange'
  /workspaces/{workspaceId}/students/{studentId}/invitations:
    post:
      operationId: issueStudentInvitation
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationIssue'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
  /workspaces/{workspaceId}/students/{studentId}/invitations/{id}:
    delete:
      operationId: revokeStudentInvitation
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      responses:
        '204':
          description: Operation completed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspaceId}/students/{studentId}/password-reset:
    post:
      operationId: issueStudentPasswordReset
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: studentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetIssue'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
  /workspaces/{workspaceId}/students/{studentId}/lessons:
    parameters:
    - $ref: '#/components/parameters/Task3WorkspaceId'
    - $ref: '#/components/parameters/Task3StudentId'
    get:
      operationId: listLessons
      description: Exact workspace/profile membership required; ADMIN and foreign content return 404. Sort date,
        time, createdAt, id descending. STUDENT always receives public projection; audience=student narrows an owning
        TEACHER without changing Actor or permissions.
      parameters:
      - $ref: '#/components/parameters/Task3Audience'
      - $ref: '#/components/parameters/Task3Page'
      - $ref: '#/components/parameters/Task3Size'
      responses:
        '200':
          description: Paged lessons in caller projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createLesson
      description: Owning TEACHER only. Short four-field form; planned status, null bundleId, empty texts, metadata
        revision 1 and each independent text revision 1 are server defaults. No historical studentReview or reviewNotes
        is copied into the new lesson.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCreateInput'
      responses:
        '201':
          description: Created lesson; navigate to preparation only after this success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherLessonView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspaceId}/students/{studentId}/lessons/{lessonId}:
    parameters:
    - $ref: '#/components/parameters/Task3WorkspaceId'
    - $ref: '#/components/parameters/Task3StudentId'
    - $ref: '#/components/parameters/Task3LessonId'
    get:
      operationId: getLesson
      description: Exact workspace/profile/lesson membership required; caller projection enforced server-side.
      parameters:
      - $ref: '#/components/parameters/Task3Audience'
      responses:
        '200':
          description: Selected lesson in caller projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateLessonMetadata
      description: Owning TEACHER only. Compare required metadata revision before writing and increment it on success.
        Omitted short-form fields are preserved; texts and their revisions are untouched. Account mismatch or stale
        metadata revision gives 409 before mutation.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonMetadataInput'
      responses:
        '200':
          description: Saved metadata with new revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherLessonView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspaceId}/students/{studentId}/lessons/{lessonId}/texts/{kind}:
    parameters:
    - $ref: '#/components/parameters/Task3WorkspaceId'
    - $ref: '#/components/parameters/Task3StudentId'
    - $ref: '#/components/parameters/Task3LessonId'
    - $ref: '#/components/parameters/Task3TextKind'
    get:
      operationId: getLessonText
      description: Exact membership required. teacherNotes returns 404 to STUDENT and to an owning TEACHER requesting
        audience=student, with no private text in the error. Read before editing to obtain this kind's independent
        revision; LessonView.revision is only the metadata revision.
      parameters:
      - $ref: '#/components/parameters/Task3Audience'
      responses:
        '200':
          description: Markdown source and independent text revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonText'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateLessonText
      description: Owning TEACHER only, independently of any read projection query. Compare this text kind's revision
        and increment on success; other texts and metadata remain unchanged. Preserve Markdown whitespace exactly.
        JSON request body greater than 4 MiB (4194304 bytes) is 413; text greater than 200000 UTF-16 units is 400.
        Stale revision/account gives 409 before mutation.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/WebClient'
      - $ref: '#/components/parameters/Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonTextInput'
      responses:
        '200':
          description: Saved source with new independent text revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonText'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspaceId}/students/{studentId}/dashboard:
    parameters:
    - $ref: '#/components/parameters/Task3WorkspaceId'
    - $ref: '#/components/parameters/Task3StudentId'
    get:
      operationId: getStudentDashboard
      description: Exact membership required; ADMIN/foreign profile return 404. Apply caller projection recursively
        to student and focus.lesson. Compute across all lessons, never one page. Convert Moscow local date/time
        to start instant and add duration to obtain end. Choose earliest start whose end >= now with date/time/createdAt/id
        ascending tie order; upcoming=true includes the current lesson and exact end boundary. Otherwise choose
        latest past lesson using descending equivalent order with upcoming=false. Empty profile has lessonCount=0
        and focus=null. This does not certify whether a lesson was conducted.
      parameters:
      - $ref: '#/components/parameters/Task3Audience'
      responses:
        '200':
          description: Profile, total lesson count, and selected lesson in caller projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
    WebClient:
      name: X-Mentor-Client
      in: header
      required: true
      schema:
        type: string
        const: web
    Account:
      name: X-Mentor-Account
      in: header
      required: true
      schema:
        type: string
    Task3WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    Task3StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
    Task3LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
    Task3TextKind:
      name: kind
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TextKind'
    Task3Audience:
      name: audience
      in: query
      required: false
      description: Optional narrowing to student projection; never changes Actor or permissions. Omitted uses actor's
        projection; STUDENT always gets public projection. Unsupported values return 400. TEACHER preview is read-only
        in UI and grants no student submission rights.
      schema:
        type: string
        enum:
        - student
    Task3Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Task3Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Problem:
      description: Structured application error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    RateLimited:
      description: Too many authentication requests
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  schemas:
    Actor:
      type: object
      additionalProperties: false
      required:
      - userId
      - workspaceId
      - role
      - authVersion
      properties:
        userId:
          type: string
        workspaceId:
          type:
          - string
          - 'null'
        role:
          type: string
          enum:
          - ADMIN
          - TEACHER
          - STUDENT
        authVersion:
          type: integer
          format: int64
          minimum: 1
    Session:
      type: object
      additionalProperties: false
      required:
      - account
      - csrfToken
      properties:
        account:
          oneOf:
          - $ref: '#/components/schemas/Actor'
          - type: 'null'
        csrfToken:
          type: string
    ApiProblem:
      type: object
      additionalProperties: false
      required:
      - status
      - code
      - message
      - fieldErrors
      - requestId
      properties:
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
    Page:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 0
          default: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        total:
          type: integer
          format: int64
          minimum: 0
    TeacherView:
      type: object
      additionalProperties: false
      required:
      - userId
      - login
      - workspaceId
      - accountDisabled
      - workspaceDisabled
      properties:
        userId:
          type: string
        login:
          type: string
        workspaceId:
          type: string
        accountDisabled:
          type: boolean
        workspaceDisabled:
          type: boolean
    InvitationView:
      type: object
      additionalProperties: false
      required:
      - id
      - state
      - expiresAt
      - createdAt
      properties:
        id:
          type: string
        state:
          type: string
          enum:
          - pending
          - used
          - revoked
          - expired
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    InvitationIssue:
      type: object
      additionalProperties: false
