        javaVersion:
          type: integer
          const: 21
        dependencies:
          type: array
          items:
            type: string
          description: Public pinned Maven groupId:artifactId:version descriptions only.
      description: Explicit public description frozen with the exercise snapshot. No image digest/tag, internal
        build revision, SHA metadata, jar path, processor, build command, or manifest provenance is exposed. Trusted
        operator environment approval remains internal.
