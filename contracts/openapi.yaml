          maxLength: 500
          description: JavaScript trim; limit in UTF-16 code units.
        studentRoadmap:
          type: string
          maxLength: 20000
          description: JavaScript trim; limit in UTF-16 code units.
        studentReview:
          type: string
          maxLength: 20000
          description: JavaScript trim; limit in UTF-16 code units.
    StudentView:
      oneOf:
      - $ref: '#/components/schemas/TeacherStudentView'
      - $ref: '#/components/schemas/PublicStudentView'
    StudentPage:
      type: object
