    StudentAccessView:
      type: object
      additionalProperties: false
      required:
      - account
      - invitation
      properties:
        account:
          oneOf:
          - $ref: '#/components/schemas/StudentAccountView'
          - type: 'null'
        invitation:
          oneOf:
          - $ref: '#/components/schemas/InvitationView'
          - type: 'null'
      description: Teacher only. Latest invitation metadata in any state; never contains raw token or link.
    LessonRevision:
      type: integer
      format: int64
      minimum: 1
      description: Starts at 1; optimistically incremented independently for metadata and each text kind.
    LessonTitle:
      type: string
      minLength: 1
      x-max-utf16-units: 200
      description: Trimmed nonempty title; maximum 200 UTF-16 units, not Unicode code points.
    LessonDate:
      type: string
      format: date
      pattern: ^\d{4}-\d{2}-\d{2}$
      description: Existing calendar date in YYYY-MM-DD, interpreted locally in Europe/Moscow.
    LessonTime:
      type: string
      pattern: ^([01]\d|2[0-3]):[0-5]\d$
      description: Moscow local HH:mm, 00:00 through 23:59.
    LessonDuration:
      type: integer
      minimum: 15
      maximum: 240
      description: Whole minutes; retained for current/end selection.
    LessonMarkdown:
      type: string
      x-max-utf16-units: 200000
      description: Exact Markdown source, including indentation/trailing spaces; no trim. Maximum 200000 UTF-16
        units (astral scalar counts as two), not OpenAPI maxLength code-point semantics. Empty string is valid.
        No maxLength is substituted for the UTF-16 bound.
    LessonCreateInput:
      type: object
      additionalProperties: false
      required:
      - title
      - date
      - time
      - duration
      properties:
        title:
          $ref: '#/components/schemas/LessonTitle'
        date:
          $ref: '#/components/schemas/LessonDate'
        time:
          $ref: '#/components/schemas/LessonTime'
        duration:
          $ref: '#/components/schemas/LessonDuration'
    LessonMetadataInput:
      type: object
      additionalProperties: false
      required:
      - revision
      properties:
        title:
          $ref: '#/components/schemas/LessonTitle'
        date:
          $ref: '#/components/schemas/LessonDate'
        time:
          $ref: '#/components/schemas/LessonTime'
        duration:
          $ref: '#/components/schemas/LessonDuration'
        revision:
          $ref: '#/components/schemas/LessonRevision'
    TextKind:
      type: string
      enum:
      - teacherNotes
      - studentNotes
      - reviewNotes
    LessonText:
      type: object
      additionalProperties: false
      required:
      - kind
      - markdown
      - revision
      properties:
        kind:
          $ref: '#/components/schemas/TextKind'
        markdown:
          $ref: '#/components/schemas/LessonMarkdown'
        revision:
          $ref: '#/components/schemas/LessonRevision'
    LessonTextInput:
      type: object
      additionalProperties: false
      required:
      - markdown
      - revision
      properties:
        markdown:
          $ref: '#/components/schemas/LessonMarkdown'
        revision:
          $ref: '#/components/schemas/LessonRevision'
    LessonView:
      description: Explicit projections. Actual STUDENT and TEACHER audience=student receive PublicLessonView; owning
        TEACHER normal reads receive TeacherLessonView. Private fields are absent, never null placeholders. No teacherNotes
        or private content in errors. revision is metadata-only.
      oneOf:
      - $ref: '#/components/schemas/TeacherLessonView'
      - $ref: '#/components/schemas/PublicLessonView'
    TeacherLessonView:
      type: object
      additionalProperties: false
      required:
      - id
      - workspaceId
      - studentId
      - title
      - date
      - time
      - timeZone
      - duration
      - status
      - bundleId
      - revision
      - createdAt
      - teacherNotes
      - studentNotes
      - reviewNotes
      properties:
        id:
          type: string
        workspaceId:
          type: string
        studentId:
          type: string
        title:
          $ref: '#/components/schemas/LessonTitle'
        date:
          $ref: '#/components/schemas/LessonDate'
        time:
          $ref: '#/components/schemas/LessonTime'
        timeZone:
          type: string
          const: Europe/Moscow
        duration:
          $ref: '#/components/schemas/LessonDuration'
        status:
          type: string
          enum:
          - planned
          - prepared
        bundleId:
          type:
          - string
          - 'null'
        revision:
          $ref: '#/components/schemas/LessonRevision'
        createdAt:
          type: string
          format: date-time
          description: UTC creation instant.
        teacherNotes:
          $ref: '#/components/schemas/LessonMarkdown'
        studentNotes:
          $ref: '#/components/schemas/LessonMarkdown'
        reviewNotes:
          $ref: '#/components/schemas/LessonMarkdown'
    PublicLessonView:
