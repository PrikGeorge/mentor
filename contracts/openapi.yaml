          minimum: 1
        createdAt:
          type: string
          format: date-time
        name:
          type: string
          maxLength: 120
          description: JavaScript trim; limit in UTF-16 code units.
        direction:
          type: string
          maxLength: 120
          description: JavaScript trim; limit in UTF-16 code units.
        goal:
          type: string
          maxLength: 1000
          description: JavaScript trim; limit in UTF-16 code units.
        schedule:
          type: string
          maxLength: 500
          description: JavaScript trim; limit in UTF-16 code units.
        notes:
          type: string
          maxLength: 5000
