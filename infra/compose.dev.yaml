name: mentor-java-dev
services:
  # Synthetic development/test fixture only; never a production object store.
  s3mock:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    profiles: [s3-test]
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: mentor-dev
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - mentor-java-s3mock:/s3mockroot
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: mentor
      POSTGRES_USER: mentor
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mentor-java-postgres:/var/lib/postgresql/data
    secrets:
      - database_password
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mentor -d mentor"]
      interval: 5s
      timeout: 3s
      retries: 10
secrets:
  database_password:
    file: ${MENTOR_DB_PASSWORD_FILE:?Set an absolute path to a private password file outside Git}
volumes:
  mentor-java-s3mock:
  mentor-java-postgres:

# Run Java with MENTOR_SECRETS_DIR pointing to an absolute private directory ending in /
# whose spring.datasource.password file contains this same database password.
# Admin setup: java -jar backend/target/backend-0.1.0-SNAPSHOT.jar admin
# The password is entered only through Console.readPassword in an interactive terminal.
# New server listens on 8081; the reference Node server is left running.
