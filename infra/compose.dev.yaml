name: mentor-java-dev
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: mentor
      POSTGRES_USER: mentor
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mentor-java-postgres:/var/lib/postgresql/data
    secrets:
      - database_password
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mentor -d mentor"]
      interval: 5s
      timeout: 3s
      retries: 10
secrets:
  database_password:
    file: ${MENTOR_DB_PASSWORD_FILE:?Set an absolute path to a private password file outside Git}
volumes:
  mentor-java-postgres:

# Run Java with MENTOR_SECRETS_DIR pointing to an absolute private directory ending in /
# whose spring.datasource.password file contains this same database password.
# Admin setup: java -jar backend/target/backend-0.1.0-SNAPSHOT.jar admin
# The password is entered only through Console.readPassword in an interactive terminal.
# New server listens on 8081; the reference Node server is left running.
