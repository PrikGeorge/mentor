# Continuous checks for the mentor platform (INF-13). Every job runs from a clean Linux or Windows runner, so the
# FAT32/CRLF quirks of the development machine never reach the result. The runner module needs real Docker with
# prepared sandbox images and is therefore a manual job (see runner/README.md).
name: ci

on:
  push:
    branches: ['**']
    tags: ['release-*']
  pull_request:
  workflow_dispatch:
    inputs:
      runner-module:
        description: Also run ./mvnw -pl runner verify (needs prepared sandbox images on the runner host)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: ./mvnw -B -ntp -pl backend verify
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
      - name: Keep backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend (Angular, Vitest, Playwright fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Schema matches the contract
        run: npm run api:check
      - name: Unit tests
        run: npm run test:coverage
      - name: Keep frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore
      - name: Production build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: UI tests on HTTP fixtures
        run: npm run test:ui -- --project=chromium
      - name: Keep Playwright output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-output
          retention-days: 7
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

  infra:
    name: Infrastructure scripts (PowerShell 7)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 -Path infra, start-local.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $failed = $true; Write-Output "$($_.FullName):"; $errors | ForEach-Object { Write-Output "  $($_.Message)" } }
          }
          if ($failed) { exit 1 }
      - name: Mock-based checks
        shell: pwsh
        run: |
          $failed = @()
          $testPowerShell = (Get-Process -Id $PID).Path
          # Scripts that need a live Docker engine or WSL stay out of CI; the remaining checks run on doubles only.
          $skip = @('cutover-integration.ps1', 'backup-fence.ps1', 'docker-context.ps1', 'caddy-runtime.ps1')
          Get-ChildItem infra/tests/*.ps1 | Where-Object { $skip -notcontains $_.Name } | ForEach-Object {
            Write-Output "== $($_.Name)"
            # Isolate mocks and expected failing native commands; use the script process exit code.
            & $testPowerShell -NoProfile -File $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed) { Write-Output "Failed: $($failed -join ', ')"; exit 1 }

  images:
    name: Container images (build and vulnerability gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [backend, frontend, infra]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Check build context boundaries on synthetic files
        shell: pwsh
        run: ./infra/tests/docker-context.ps1
      - name: Install verified Trivy
        run: |
          mkdir -p "$RUNNER_TEMP/trivy" image-reports
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/trivy/archive.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
          echo "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7  $RUNNER_TEMP/trivy/archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy/archive.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/backend/Dockerfile
          build-args: JAR_SOURCE=build
          push: false
          load: true
          tags: mentor-ci-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/frontend/Dockerfile
          build-args: DIST_SOURCE=build
          push: false
          load: true
          tags: mentor-ci-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/runner-service/Dockerfile
          build-args: JAR_SOURCE=build
          push: false
          load: true
          tags: mentor-ci-runner:${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max
      - name: Check web and private gateway on the same image
        shell: pwsh
        run: ./infra/tests/caddy-runtime.ps1 -Image mentor-ci-web:${{ github.sha }}
      - name: Scan exact images and enforce policy
        shell: pwsh
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          $ErrorActionPreference = 'Stop'
          $images = [ordered]@{}
          $failed = @()
          $postgres = 'postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24'
          docker pull $postgres
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL image pull failed.' }
          foreach ($profile in @('backend', 'web', 'runner', 'postgres')) {
            try {
              $image = if ($profile -eq 'postgres') { $postgres } else { "mentor-ci-${profile}:$env:GITHUB_SHA" }
              $id = docker image inspect --format '{{.Id}}' $image
              if ($LASTEXITCODE -ne 0 -or $id -cnotmatch '^sha256:[a-f0-9]{64}$') { throw "Cannot identify $profile image." }
              $images[$profile] = $id
              $packages = if ($profile -eq 'postgres') { 'os' } else { 'os,library' }
              $report = Join-Path $PWD "image-reports/$profile.json"
              trivy image --config /dev/null --timeout 15m --image-src docker --scanners vuln --pkg-types $packages --list-all-pkgs --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --ignore-unfixed=false --ignorefile /dev/null --format json --output $report $id
              if ($LASTEXITCODE -ne 0) { throw "Trivy failed for $profile." }
              ./infra/check-image-scan.ps1 -ReportFile $report -ExpectedImageId $id -Profile $profile | Format-List
            } catch { $failed += $profile; Write-Output $_ }
          }
          $images | ConvertTo-Json | Set-Content image-reports/image-ids.json
          trivy --version --format json > image-reports/scanner.json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record scanner/database version.' }
          if ($failed.Count) { throw "Image gates failed: $($failed -join ', ')" }
      - name: Keep complete image reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-vulnerability-reports
          path: image-reports/
          retention-days: 7
          if-no-files-found: warn
      - name: Save scanned release images
        if: startsWith(github.ref, 'refs/tags/release-')
        shell: pwsh
        run: |
          $images = Get-Content image-reports/image-ids.json -Raw | ConvertFrom-Json -AsHashtable
          New-Item -ItemType Directory release-images | Out-Null
          docker image save --output release-images/images.tar $images.backend $images.web $images.runner
          if ($LASTEXITCODE -ne 0) { throw 'Cannot export scanned images.' }
          $manifest = @{ Images = @{ backend = $images.backend; web = $images.web; runner = $images.runner }; ArchiveSha256 = (Get-FileHash release-images/images.tar -Algorithm SHA256).Hash }
          $manifest | ConvertTo-Json | Set-Content release-images/manifest.json
      - name: Pass scanned images to publisher
        if: startsWith(github.ref, 'refs/tags/release-')
        uses: actions/upload-artifact@v4
        with:
          name: scanned-release-images
          path: release-images/
          retention-days: 1
          if-no-files-found: error

  publish-images:
    name: Publish the scanned images
    if: startsWith(github.ref, 'refs/tags/release-')
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scanned-release-images
          path: release-images
      - name: Verify and load scanned archives
        shell: pwsh
        run: |
          $manifest = Get-Content release-images/manifest.json -Raw | ConvertFrom-Json -AsHashtable
          if ($manifest.ArchiveSha256 -notmatch '^[a-fA-F0-9]{64}$' -or (Get-FileHash release-images/images.tar -Algorithm SHA256).Hash -ne $manifest.ArchiveSha256) { throw 'Image archive checksum mismatch.' }
          docker image load --input release-images/images.tar
          if ($LASTEXITCODE -ne 0) { throw 'Cannot load image archive.' }
          foreach ($profile in @('backend', 'web', 'runner')) {
            $id = $manifest.Images[$profile]
            if ($id -cnotmatch '^sha256:[a-f0-9]{64}$') { throw "Invalid image ID: $profile" }
            $loadedId = docker image inspect --format '{{.Id}}' $id
            if ($LASTEXITCODE -ne 0 -or $loadedId -cne $id) { throw "Image ID mismatch: $profile" }
          }
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish without rebuilding
        shell: pwsh
        run: |
          $manifest = Get-Content release-images/manifest.json -Raw | ConvertFrom-Json -AsHashtable
          $release = $env:GITHUB_REF -creplace '^refs/tags/release-', ''
          if ($release -cnotmatch '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$') { throw 'Invalid release tag.' }
          $repository = $env:GITHUB_REPOSITORY.ToLowerInvariant()
          foreach ($profile in @('backend', 'web', 'runner')) {
            $tag = "ghcr.io/$repository/${profile}:$release"
            docker image tag $manifest.Images[$profile] $tag
            if ($LASTEXITCODE -ne 0) { throw "Cannot tag $profile." }
            docker image push $tag
            if ($LASTEXITCODE -ne 0) { throw "Cannot publish $profile." }
          }

  runner-module:
    name: Runner module (manual, needs prepared sandbox images)
    if: github.event_name == 'workflow_dispatch' && inputs.runner-module
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify runner
        # Expects the sandbox environment images from `java -jar runner.jar --prepare` on this host; see runner/README.md.
        run: ./mvnw -B -ntp -pl runner verify
