server:
  port: 8081
  forward-headers-strategy: none
  shutdown: graceful
spring:
  servlet:
    multipart:
      max-file-size: 20971520B
      max-request-size: 22020096B
      # Small fields stay in memory; file parts spill to the multipart directory (a writable volume in Compose, not tmpfs).
      file-size-threshold: 256KB
      location: ${MENTOR_MULTIPART_DIR:${java.io.tmpdir}}
  config:
    import: optional:configtree:${MENTOR_SECRETS_DIR:./.runtime/secrets/}
  datasource:
    url: ${MENTOR_DB_URL:jdbc:postgresql://127.0.0.1:5433/mentor}
    username: ${MENTOR_DB_USER:mentor}
    password: ""
  session:
    timeout: 8h
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
mentor:
  security:
    production: ${MENTOR_PRODUCTION:false}
    public-origin: ${MENTOR_PUBLIC_ORIGIN:}
